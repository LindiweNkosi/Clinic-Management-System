<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book, search, update, complete, and cancel clinic appointments in the ClinicEase demo system.">
    <title>ClinicEase | Booking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   

    <!-- NAVIGATION -->
    <nav>

     <div class="logo">
           ClinicEase
        </div>

            <div class="hamburger" onclick="toggleMenu()">&#9776;</div>

        <div class="nav-links" id="navLinks">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="booking.html">Booking</a>
            <a href="analytics.html">Analytics</a>
            <a href="documentation.html">Documentation</a>
            <button class="nav-button" onclick="logout()">Logout</button>

        </div>
    </nav>


<div class="container">  

    <h1>Book an Appointment</h1>

    <div class="card">

        <form id="bookingForm">

            <label>Full Name</label>
            <input type="text" id="name">

            <label>Email Address</label>
            <input type="email" id="email">

            <label>Phone Number</label>
            <input type="tel" id="phone">

            <label>Select Service</label>

            <select id="service">

                <option value="">-- Select Service --</option>

                <option>General Consultation</option>

                <option>Dental Care</option>

                <option>Eye Examination</option>

                <option>Training Session</option>

            </select>

            <label>Appointment Date</label>
            <input type="date" id="date">

            <label>Additional Notes</label>
            <textarea id="notes"></textarea>

            <button type="submit">
                Submit Booking
            </button>


        </form>

        <button class="secondary-button" data-admin-only onclick="clearDemoData()">
            Clear Demo Bookings
        </button>

        <!-- MESSAGE AREA -->
        <p id="confirmationMessage"></p>
        

        <!-- BOOKING LIST -->
        <div class="card">
            <h2>Booked Appointments</h2>
            
            <!-- SEARCH BAR -->
            <input type="text" id="searchInput" placeholder="Search patient name">
            
            <table id="bookingTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Notes</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingList">
                    <!-- Bookings will be dynamically inserted here -->
                </tbody>
            </table>
        </div>

</div>
    </div>

</div>

</div> <div id="customAlertModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-icon">&#10003;</div>
            <h2>Success!</h2>
            <p>Your appointment has been successfully booked.</p>
            <button type="button" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <footer>
        <p>ClinicEase &copy; 2026 | Clinic Training & Booking Management System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
